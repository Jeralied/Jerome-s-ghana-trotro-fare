<!DOCTYPE html>
<html>
<head>
  <title>Accra Trotro Fare Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 <h1>🚌 Accra Trotro Fare Calculator</h1>
  <section style="background:#f0f9ff; padding:15px; border-radius:10px; margin-bottom:20px;">
  <h3>About This Project</h3>
  <p>
    Built by a GCTU student to help 2M+ people in Accra estimate trotro fares. 
    No more confusion at the station. Phase 2: AI + GPS route optimization coming soon.
  </p>
</section>
<div class="subtitle-container">
    <p class="subtitle">Built by Ali for KAUST/OIST 2026 🇬🇭</p>
    <div class="bus">🚌</div>
</div>
    <label>From:</label>
   <select id="from">
  <option value="Circle">Circle</option>
  <option value="Kaneshie">Kaneshie</option>
  <option value="Accra Mall">Accra Mall</option>
  <option value="Tudu">Tudu</option>
  <option value="Makola">Makola</option>
  <option value="Lapaz">Lapaz</option>
</select>
    <label>To:</label>
<select id="to">
  <option value="Circle">Circle</option>
  <option value="Kaneshie">Kaneshie</option>
  <option value="Accra Mall">Accra Mall</option>
  <option value="Tudu">Tudu</option>
  <option value="Makola">Makola</option>
  <option value="Lapaz">Lapaz</option>
</select>
    <button id="calculateBtn">Calculate Fare</button>
  <button onclick="alert('We are adding 50+ more Accra routes. Follow the GitHub for updates!')" 
style="background:#ff9800; color:white; border:none; padding:10px; border-radius:8px; margin-top:10px; cursor:pointer;">
  🗺️ Request New Route
</button>
    <div id="result"></div>
  </div>
  <script src="script.js?v=4"></script>
</body>
</html>
